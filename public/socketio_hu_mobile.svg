<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1090" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Hogyan áramlik az adat a Socket.IO-ban a hálózaton át</title>
  <desc id="d">Az üzenet végighalad a JavaScript, Socket.IO, WebSocket, Node, write(), kernel socket, TCP, IP, Ethernet és hálózati kártya rétegeken, átkel az interneten, majd ugyanazon a tükrözött rétegsoron visszajut a JavaScript callback-ig.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gSend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gRecv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gNet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  <path id="arrowDownSmall" d="M-1.5,-6 H1.5 V1 H4.5 L0,7 L-4.5,1 H-1.5 Z"/>
  <path id="arrowUpSmall" d="M-1.5,6 H1.5 V-1 H4.5 L0,-7 L-4.5,-1 H-1.5 Z"/>
  </defs>

  <rect width="320" height="1090" fill="url(#bg)"/>

  <text x="160" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Adatáramlás Socket.IO-val</text>
  <text x="160" y="46" text-anchor="middle" font-size="11.5" fill="#64748b">Le a rétegeken, át a hálózaton, majd vissza fel</text>

  <!-- ============ KÜLDÉS KÁRTYA ============ -->
  <g transform="translate(20,64)">
    <rect width="280" height="460" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <rect width="280" height="90" rx="18" fill="url(#gSend)"/>
    <rect y="68" width="280" height="22" fill="url(#gSend)"/>
    <circle cx="140" cy="42" r="26" fill="#ffffff"/>
    <path transform="translate(140,42)" d="M-3,-14 L3,-14 L3,3 L9,3 L0,15 L-9,3 L-3,3 Z" fill="#2563eb"/>
    <text x="140" y="119" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="0.5">KÜLDÉS</text>
    <line x1="20" y1="134" x2="260" y2="134" stroke="#e2e8f0" stroke-width="2"/>

    <g fill="#334155" font-size="14.5">
      <use href="#arrowDownSmall" x="34" y="157" fill="#3b82f6"/><text x="52" y="162">JavaScript</text>
      <use href="#arrowDownSmall" x="34" y="187" fill="#3b82f6"/><text x="52" y="192">Socket.IO</text>
      <use href="#arrowDownSmall" x="34" y="217" fill="#3b82f6"/><text x="52" y="222">WebSocket</text>
      <use href="#arrowDownSmall" x="34" y="247" fill="#3b82f6"/><text x="52" y="252">Node.js</text>
      <use href="#arrowDownSmall" x="34" y="277" fill="#3b82f6"/><text x="52" y="282" font-family="ui-monospace, monospace">write()</text>
      <use href="#arrowDownSmall" x="34" y="307" fill="#3b82f6"/><text x="52" y="312">Kernel socket</text>
      <use href="#arrowDownSmall" x="34" y="337" fill="#3b82f6"/><text x="52" y="342">TCP</text>
      <use href="#arrowDownSmall" x="34" y="367" fill="#3b82f6"/><text x="52" y="372">IP</text>
      <use href="#arrowDownSmall" x="34" y="397" fill="#3b82f6"/><text x="52" y="402">Ethernet</text>
      <use href="#arrowDownSmall" x="34" y="427" fill="#3b82f6"/><text x="52" y="432">Hálózati kártya</text>
    </g>
  </g>

  <!-- ============ INTERNET HÍD ============ -->
  <path d="M160,524 L160,543" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="75" y="544" width="170" height="42" rx="21" fill="url(#gNet)"/>
  <text x="160" y="570" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">INTERNET</text>
  <path d="M160,586 L160,605" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ FOGADÁS KÁRTYA ============ -->
  <g transform="translate(20,606)">
    <rect width="280" height="460" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <rect width="280" height="90" rx="18" fill="url(#gRecv)"/>
    <rect y="68" width="280" height="22" fill="url(#gRecv)"/>
    <circle cx="140" cy="42" r="26" fill="#ffffff"/>
    <path transform="translate(140,42)" d="M-3,14 L3,14 L3,-3 L9,-3 L0,-15 L-9,-3 L-3,-3 Z" fill="#059669"/>
    <text x="140" y="119" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="0.5">FOGADÁS</text>
    <line x1="20" y1="134" x2="260" y2="134" stroke="#e2e8f0" stroke-width="2"/>

    <g fill="#334155" font-size="14.5">
      <use href="#arrowUpSmall" x="34" y="157" fill="#10b981"/><text x="52" y="162">JavaScript callback</text>
      <use href="#arrowUpSmall" x="34" y="187" fill="#10b981"/><text x="52" y="192">Socket.IO</text>
      <use href="#arrowUpSmall" x="34" y="217" fill="#10b981"/><text x="52" y="222">WebSocket</text>
      <use href="#arrowUpSmall" x="34" y="247" fill="#10b981"/><text x="52" y="252">Node.js</text>
      <use href="#arrowUpSmall" x="34" y="277" fill="#10b981"/><text x="52" y="282" font-family="ui-monospace, monospace">read()</text>
      <use href="#arrowUpSmall" x="34" y="307" fill="#10b981"/><text x="52" y="312">Kernel socket</text>
      <use href="#arrowUpSmall" x="34" y="337" fill="#10b981"/><text x="52" y="342">TCP</text>
      <use href="#arrowUpSmall" x="34" y="367" fill="#10b981"/><text x="52" y="372">IP</text>
      <use href="#arrowUpSmall" x="34" y="397" fill="#10b981"/><text x="52" y="402">Ethernet</text>
      <use href="#arrowUpSmall" x="34" y="427" fill="#10b981"/><text x="52" y="432">Hálózati kártya</text>
    </g>
  </g>
</svg>
