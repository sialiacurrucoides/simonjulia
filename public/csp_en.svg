<svg viewBox="0 0 920 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How Content Security Policy works</title>
  <desc id="d">A browser requests a page, the server returns it with a Content-Security-Policy header, and the browser allows resources from approved sources while blocking everything else.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="240" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#2C2C2A">How Content Security Policy Works</text>
  <text x="40" y="72" font-size="14" fill="#5F5E5A">CSP is an HTTP response header that tells the browser which sources of content it is allowed to load.</text>

  <!-- card 1 allowed self -->
  <rect x="40" y="84" width="266" height="140" rx="12" fill="#E1F5EE" stroke="#9FE1CB"/>
  <circle cx="68" cy="108" r="13" fill="#1D9E75"/>
  <path d="M62,108 l4,4 l8,-9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="115" font-size="15" font-weight="700" fill="#0F6E56">ALLOWED</text>
  <text x="60" y="148" font-size="13" fill="#0F6E56" font-family="ui-monospace, monospace">/app.js  (same origin)</text>
  <text x="60" y="174" font-size="12.5" fill="#085041">Matches 'self' in script-src,</text>
  <text x="60" y="192" font-size="12.5" fill="#085041">so the script runs.</text>

  <!-- card 2 allowed CDN -->
  <rect x="327" y="84" width="266" height="140" rx="12" fill="#E1F5EE" stroke="#9FE1CB"/>
  <circle cx="355" cy="108" r="13" fill="#1D9E75"/>
  <path d="M349,108 l4,4 l8,-9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="377" y="115" font-size="15" font-weight="700" fill="#0F6E56">ALLOWED</text>
  <text x="347" y="148" font-size="13" fill="#0F6E56" font-family="ui-monospace, monospace">cdn.trusted.com/lib.js</text>
  <text x="347" y="174" font-size="12.5" fill="#085041">On the whitelist in</text>
  <text x="347" y="192" font-size="12.5" fill="#085041">script-src, so it loads.</text>

  <!-- card 3 blocked -->
  <rect x="614" y="84" width="266" height="140" rx="12" fill="#FAECE7" stroke="#F0997B"/>
  <circle cx="642" cy="108" r="13" fill="#D85A30"/>
  <path d="M637,103 l10,10 M647,103 l-10,10" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <text x="664" y="115" font-size="15" font-weight="700" fill="#993C1D">BLOCKED</text>
  <text x="634" y="148" font-size="13" fill="#993C1D" font-family="ui-monospace, monospace">evil.com/x.js + inline</text>
  <text x="634" y="174" font-size="12.5" fill="#712B13">Not on any list. Browser</text>
  <text x="634" y="192" font-size="12.5" fill="#712B13">refuses it &amp; can report it.</text>
</svg>
