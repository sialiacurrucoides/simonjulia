<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gKnow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gHave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gAre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="580" fill="url(#bg)"/>

  <!-- Heading -->
  <text x="480" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a">Multi-Factor Authentication</text>
  <text x="480" y="90" text-anchor="middle" font-size="17" fill="#64748b">The three authentication factors</text>

  <!-- ============ CARD 1: KNOW ============ -->
  <g transform="translate(40,130)">
    <rect width="270" height="400" rx="20" fill="#ffffff" filter="url(#shadow)"/>
    <rect width="270" height="110" rx="20" fill="url(#gKnow)"/>
    <rect y="70" width="270" height="40" fill="url(#gKnow)"/>
    <!-- icon: lock -->
    <circle cx="135" cy="55" r="34" fill="#ffffff"/>
    <g transform="translate(135,55)" fill="#2563eb">
      <path d="M -12 -3 a12 12 0 0 1 24 0 L 5 -3 a5 5 0 0 0 -10 0 Z"/>
      <rect x="-14" y="-4" width="28" height="23" rx="4"/>
      <circle cx="0" cy="5" r="3.4" fill="#ffffff"/>
      <rect x="-1.6" y="5" width="3.2" height="8" rx="1.4" fill="#ffffff"/>
    </g>
    <text x="135" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">What you know</text>
    <line x1="40" y1="172" x2="230" y2="172" stroke="#e2e8f0" stroke-width="2"/>
    <!-- examples -->
    <g transform="translate(40,210)">
      <circle cx="10" cy="0" r="6" fill="#3b82f6"/>
      <text x="32" y="6" font-size="19" fill="#334155">Password</text>
    </g>
    <g transform="translate(40,260)">
      <circle cx="10" cy="0" r="6" fill="#3b82f6"/>
      <text x="32" y="6" font-size="19" fill="#334155">PIN code</text>
    </g>
    <g transform="translate(40,310)">
      <circle cx="10" cy="0" r="6" fill="#3b82f6"/>
      <text x="32" y="6" font-size="19" fill="#334155">Security question</text>
    </g>
  </g>

  <!-- ============ CARD 2: HAVE ============ -->
  <g transform="translate(345,130)">
    <rect width="270" height="400" rx="20" fill="#ffffff" filter="url(#shadow)"/>
    <rect width="270" height="110" rx="20" fill="url(#gHave)"/>
    <rect y="70" width="270" height="40" fill="url(#gHave)"/>
    <!-- icon: phone -->
    <circle cx="135" cy="55" r="34" fill="#ffffff"/>
    <g transform="translate(135,55)">
      <rect x="-13" y="-20" width="26" height="40" rx="5" fill="#059669"/>
      <rect x="-9" y="-15" width="18" height="26" rx="1.5" fill="#ffffff"/>
      <circle cx="0" cy="15" r="2.4" fill="#ffffff"/>
    </g>
    <text x="135" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">What you have</text>
    <line x1="40" y1="172" x2="230" y2="172" stroke="#e2e8f0" stroke-width="2"/>
    <g transform="translate(40,210)">
      <circle cx="10" cy="0" r="6" fill="#10b981"/>
      <text x="32" y="6" font-size="19" fill="#334155">Phone</text>
    </g>
    <g transform="translate(40,260)">
      <circle cx="10" cy="0" r="6" fill="#10b981"/>
      <text x="32" y="6" font-size="19" fill="#334155">Hardware key</text>
    </g>
    <g transform="translate(40,310)">
      <circle cx="10" cy="0" r="6" fill="#10b981"/>
      <text x="32" y="6" font-size="19" fill="#334155">Authenticator app</text>
    </g>
  </g>

  <!-- ============ CARD 3: ARE ============ -->
  <g transform="translate(650,130)">
    <rect width="270" height="400" rx="20" fill="#ffffff" filter="url(#shadow)"/>
    <rect width="270" height="110" rx="20" fill="url(#gAre)"/>
    <rect y="70" width="270" height="40" fill="url(#gAre)"/>
    <!-- icon: fingerprint -->
    <circle cx="135" cy="55" r="34" fill="#ffffff"/>
    <g transform="translate(135,57)" fill="#7c3aed">
      <path d="M -18 4 a18 18 0 0 1 36 0 L 14.5 4 a14.5 14.5 0 0 0 -29 0 Z"/>
      <path d="M -11 4 a11 11 0 0 1 22 0 L 7.5 4 a7.5 7.5 0 0 0 -15 0 Z"/>
      <path d="M -4 4 a4 4 0 0 1 8 0 L 4 4 a0 0 0 0 0 -8 0 Z"/>
      <circle cx="0" cy="4" r="2.6"/>
      <rect x="-18.5" y="6" width="3" height="9" rx="1.5"/>
      <rect x="15.5" y="6" width="3" height="9" rx="1.5"/>
      <rect x="-11.5" y="6" width="3" height="13" rx="1.5"/>
      <rect x="8.5" y="6" width="3" height="13" rx="1.5"/>
      <rect x="-1.5" y="6" width="3" height="15" rx="1.5"/>
    </g>
    <text x="135" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">What you are</text>
    <line x1="40" y1="172" x2="230" y2="172" stroke="#e2e8f0" stroke-width="2"/>
    <g transform="translate(40,210)">
      <circle cx="10" cy="0" r="6" fill="#a855f7"/>
      <text x="32" y="6" font-size="19" fill="#334155">Fingerprint</text>
    </g>
    <g transform="translate(40,260)">
      <circle cx="10" cy="0" r="6" fill="#a855f7"/>
      <text x="32" y="6" font-size="19" fill="#334155">Face recognition</text>
    </g>
    <g transform="translate(40,310)">
      <circle cx="10" cy="0" r="6" fill="#a855f7"/>
      <text x="32" y="6" font-size="19" fill="#334155">Voice recognition</text>
    </g>
  </g>
</svg>
