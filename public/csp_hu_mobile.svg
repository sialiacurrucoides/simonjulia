<svg viewBox="0 0 300 534" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">A Content Security Policy működése</title>
  <desc id="d">Ha a böngésző kér egy oldalt, a szerver visszaadja azt egy Content-Security-Policy fejléccel, ami után a böngésző csak engedélyezett forrásokat fogad el, minden mást blokkol.</desc>

  <rect x="0" y="0" width="300" height="534" fill="#FFFFFF"/>

  <text x="14" y="30" font-size="19" font-weight="700" fill="#2C2C2A">Hogyan működik a CSP</text>

  <!-- card 1: allowed self -->
  <rect x="14" y="60" width="272" height="142" rx="12" fill="#E1F5EE" stroke="#9FE1CB"/>
  <circle cx="42" cy="88" r="13" fill="#1D9E75"/>
  <path d="M36,88 l4,4 l8,-9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="93" font-size="17" font-weight="700" fill="#0F6E56">ENGEDÉLYEZETT</text>
  <text x="34" y="118" font-size="13.5" fill="#0F6E56" font-family="ui-monospace, monospace">/app.js  (same origin)</text>
  <text x="34" y="140" font-size="15" fill="#085041">Egyezik a 'self'-el</text>
  <text x="34" y="158" font-size="15" fill="#085041">a script-src-ben,</text>
  <text x="34" y="176" font-size="15" fill="#085041">a kód futhat.</text>

  <!-- card 2: allowed CDN -->
  <rect x="14" y="216" width="272" height="142" rx="12" fill="#E1F5EE" stroke="#9FE1CB"/>
  <circle cx="42" cy="244" r="13" fill="#1D9E75"/>
  <path d="M36,244 l4,4 l8,-9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="249" font-size="17" font-weight="700" fill="#0F6E56">ENGEDÉLYEZETT</text>
  <text x="34" y="274" font-size="13.5" fill="#0F6E56" font-family="ui-monospace, monospace">cdn.trusted.com/lib.js</text>
  <text x="34" y="296" font-size="15" fill="#085041">Az engedélyezett listán</text>
  <text x="34" y="314" font-size="15" fill="#085041">a script-src-ben,</text>
  <text x="34" y="332" font-size="15" fill="#085041">betölti.</text>

  <!-- card 3: blocked -->
  <rect x="14" y="372" width="272" height="142" rx="12" fill="#FAECE7" stroke="#F0997B"/>
  <circle cx="42" cy="400" r="13" fill="#D85A30"/>
  <path d="M37,395 l10,10 M47,395 l-10,10" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <text x="64" y="405" font-size="17" font-weight="700" fill="#993C1D">BLOKKOLT</text>
  <text x="34" y="430" font-size="13.5" fill="#993C1D" font-family="ui-monospace, monospace">evil.com/x.js + inline</text>
  <text x="34" y="452" font-size="15" fill="#712B13">Nincs a listán. A</text>
  <text x="34" y="470" font-size="15" fill="#712B13">böngésző elutasítja</text>
  <text x="34" y="488" font-size="15" fill="#712B13">&amp; jelentheti.</text>
</svg>
